apiVersion: apps/v1
kind: Deployment
metadata:
  name: sleyz-worker
  namespace: converza-sales
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sleyz-worker
  template:
    metadata:
      labels:
        app: sleyz-worker
        com.docker.compose.network.default: "true"
    spec:
      containers:
        - name: sleyz-worker
          image: converza_sales-sales-bot
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.sleyz"]
          envFrom:
            - secretRef:
                name: converza-sales-runtime
