# Template only. Populate this secret out of band before deploying the service.
# Required keys: SUPABASE_URL, SUPABASE_SERVICE_KEY, SALES_BOT_TOKEN,
# MANAGER_BOT_TOKEN, SALES_WEBHOOK_SECRET, HUAWEI_MAAS_API_KEY, HUAWEI_MAAS_MODEL,
# HUAWEI_MAAS_BASE_URL (the exact deployment URL).
# Optional Instagram keys: INSTAGRAM_APP_SECRET, INSTAGRAM_VERIFY_TOKEN,
# INSTAGRAM_CONNECTIONS (JSON account-to-organization/token mapping), INSTAGRAM_GRAPH_VERSION.
# No credential values belong in version control.
apiVersion: v1
kind: Secret
metadata:
  name: converza-sales-runtime
  namespace: converza-sales
type: Opaque
data: {}
