services:
  api:
    build:
      context: ..
      dockerfile: core/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  indexer:
    build:
      context: ..
      dockerfile: core/Dockerfile
    env_file: .env
    command: ["python", "-m", "services.indexer"]
    restart: unless-stopped
  sleyz-ingress:
    build:
      context: ..
      dockerfile: Sleyz/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped
  sleyz-worker:
    build:
      context: ..
      dockerfile: Sleyz/Dockerfile
    env_file: .env
    command: ["python", "-m", "services.sleyz"]
    restart: unless-stopped
