# Optional deterministic-production mounts. Paths must be provisioned before startup.
# From root: docker compose --env-file web/.env.local -f compose.yml -f core/compose.vea.yml --profile workers up -d --build
services:
  vea-renderer:
    volumes:
      - type: bind
        source: ${VEA_ASSET_HOST_PATH:-./brand-assets}
        target: /MoneyPrinterTurbo/brand-assets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VEA_MODEL_HOST_PATH:-./vea-models}
        target: /MoneyPrinterTurbo/models
        read_only: true
        bind:
          create_host_path: false
